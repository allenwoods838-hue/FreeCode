name: Release

# Push a version tag (v*) and this builds the package, sanity-checks it,
# and publishes it to PyPI via Trusted Publishing — no API tokens needed.
# One-time setup: https://pypi.org/manage/account/publishing/ →
# add a publisher for this repo with workflow name "release.yml".

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sanity check
        run: |
          python -m compileall -q freecode
          python -c "import freecode; print(freecode.__version__)"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for PyPI Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
