name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile and import
        run: |
          python -m compileall -q freecode
          python -c "import freecode, freecode.agent, freecode.repl, freecode.llm"
      - name: Install from source, check the entry point
        run: |
          python -m pip install .
          freecode --version
